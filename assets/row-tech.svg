    <style>
  text { font-family: 'Palatino Linotype','Book Antiqua',Palatino,Georgia,'Noto Serif CJK SC','Source Han Serif SC','Noto Serif SC','Songti SC','SimSun','Microsoft YaHei',serif; fill: #e8dcc0; }
  .mono { font-family: 'JetBrains Mono','Cascadia Code','SFMono-Regular',Consolas,'Sarasa Mono SC','Noto Sans Mono CJK SC','Liberation Mono',monospace; }
  .dim { fill: #b8ab8d; }
  .ash { fill: #8d8472; }
  .gold { fill: url(#gold); }
  .ember { fill: #a13a26; }
  .spin { animation: spin 110s linear infinite; }
  .breathe { animation: breathe 7s ease-in-out infinite; }
  .dust { animation: rise 9s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }
  @keyframes breathe { 0%, 100% { opacity: .5; } 50% { opacity: 1; } }
  @keyframes rise {
    0% { transform: translateY(0); opacity: 0; }
    18% { opacity: .85; }
    100% { transform: translateY(-96px); opacity: 0; }
  }
  @media (prefers-reduced-motion: reduce) {
    .spin, .breathe, .dust { animation: none !important; }
  }
</style>
