name: Refresh profile

on:
  schedule:
    - cron: '17 1 * * 1'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: profile-refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.event.repository.default_branch }}

      - name: Render design assets
        run: node scripts/render-profile.mjs

      - name: Refresh GitHub data
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node scripts/update-stats.mjs

      - name: Publish updated assets
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          git add -A -- assets README.md
          if git diff --cached --quiet; then
            exit 0
          fi
          git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m 'chore: refresh profile'
          git pull --rebase origin "$DEFAULT_BRANCH"
          git push origin "HEAD:refs/heads/$DEFAULT_BRANCH"
